# Used by Coolify (Docker Compose build pack). Items, sets, images and the profile live in the
# "sao-gear-data" volume, so they survive redeploys.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VIEWER_USER=${VIEWER_USER}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD}
    volumes:
      - sao-gear-data:/data
    expose:
      - "3077"

volumes:
  sao-gear-data:
